# One Worker per Slack workspace, with its own D1, KV, queue and secrets.
# Fill in the ids, then see README.md for the Slack app and secrets.

name = "slack-agent"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Slack posts to /slack/events and /slack/interactions on this Worker. Every
# request is checked against the signing secret; nothing else answers.
workers_dev = true
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[triggers]
# Hourly: expire unanswered forms and old OAuth links, forget conversations older than 30 days.
crons = ["0 * * * *"]

[vars]
ASSISTANT_NAME = "Assistant"
TIME_ZONE = "Australia/Sydney"
# ALLOWED_USERS, ADMIN_USERS and SLACK_TEAM_ID are set as secrets (and in .dev.vars for
# wrangler dev), so whose workspace this is stays out of git. See .dev.vars.example.
# The defaults. Admins can change these in Slack; the cap never past MAX_CAP_USD.
MONTHLY_CAP_USD = "5"
MAX_CAP_USD = "50"
# Unset, it's Workers AI's @cf/zai-org/glm-4.7-flash. Any other @cf/ model name works,
# and "offline" tries everything without a model and costs nothing.
# AI_MODEL = "offline"
# What images__describe uses. Unset, it's @cf/mistralai/mistral-small-3.1-24b-instruct.
# AI_VISION_MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct"
# Calls go through this AI Gateway once it exists (dashboard, AI, AI Gateway, same name).
# AI_GATEWAY_ID = "slack-agent"
# Per tool, allow / ask / never. Tools that change things ask unless set here.
# TOOL_POLICY = '{"notes__save":"ask"}'
# Remote MCP servers, by name. They never get a credential.
# MCP_SERVERS = '{"docs":"https://mcp.example.com/mcp"}'
# Credentials tools may use, and the only hosts each may go to. The value is the
# CREDENTIAL_<NAME> secret.
# CREDENTIAL_HOSTS = '{"github":["api.github.com"]}'
# Accounts admins can connect by saying "connect github". Needs PUBLIC_URL (this
# Worker's URL; the OAuth app's callback is PUBLIC_URL/oauth/callback) and the
# OAUTH_<NAME>_CLIENT_ID and OAUTH_<NAME>_CLIENT_SECRET secrets.
# OAUTH_PROVIDERS = '{"github":{"scopes":"read:user"}}'
# PUBLIC_URL = "https://slack-agent.<your subdomain>.workers.dev"

[ai]
binding = "AI"
# Workers AI always runs on Cloudflare, even in wrangler dev, and is billed.
remote = true

[[d1_databases]]
binding = "DB"
database_name = "slack-agent"            # wrangler d1 create slack-agent --location oc
database_id = "<d1 id>"

[[kv_namespaces]]
binding = "KV"
id = "<kv id>"

[[queues.producers]]
binding = "JOBS"
queue = "slack-agent-jobs"               # wrangler queues create slack-agent-jobs

[[queues.consumers]]
queue = "slack-agent-jobs"
max_batch_size = 1
max_batch_timeout = 0
# One job at a time, so two messages in one thread can't both rewrite the conversation.
max_concurrency = 1
max_retries = 0

# Secrets (wrangler secret put <NAME> --config wrangler.toml):
#   ALLOWED_USERS, ADMIN_USERS, SLACK_TEAM_ID (see .dev.vars.example)
#   SLACK_SIGNING_SECRET, SLACK_BOT_TOKEN
#   KEYRING      {"current":"k1","keys":{"k1":"<32 random bytes, base64>"}}
#   SIGNING_KEY  at least 32 random characters
#   CREDENTIAL_<NAME> for each API key in CREDENTIAL_HOSTS
#   OAUTH_<NAME>_CLIENT_ID, OAUTH_<NAME>_CLIENT_SECRET for each OAUTH_PROVIDERS entry
